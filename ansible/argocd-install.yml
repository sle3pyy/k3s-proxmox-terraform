---
- name: Install ArgoCD via Helm
  hosts: control_plane
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    argocd_node_port: 30080
    argocd_homepage_account: homepage
  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - python3-pip
          - curl
        state: present
        update_cache: true

    - name: Install Helm
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        executable: /bin/bash
      changed_when: false

    - name: Add ArgoCD Helm repository
      ansible.builtin.shell:
        cmd: helm repo add argo https://argoproj.github.io/argo-helm
      args:
        executable: /bin/bash
      changed_when: false

    - name: Update Helm repositories
      ansible.builtin.shell:
        cmd: helm repo update
      args:
        executable: /bin/bash
      changed_when: false

    - name: Write ArgoCD Helm values
      ansible.builtin.copy:
        dest: /tmp/argocd-values.yml
        mode: '0600'
        content: |
          server:
            service:
              type: NodePort
              nodePortHttp: {{ argocd_node_port }}
          configs:
            params:
              server.insecure: true
            cm:
              accounts.{{ argocd_homepage_account }}: apiKey
              accounts.{{ argocd_homepage_account }}.enabled: "true"
            rbac:
              policy.csv: |
                g, {{ argocd_homepage_account }}, role:readonly

    - name: Install ArgoCD using Helm
      ansible.builtin.shell:
        cmd: |
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --values /tmp/argocd-values.yml
      args:
        executable: /bin/bash
      changed_when: false

    - name: Wait for ArgoCD pods to be ready
      ansible.builtin.shell:
        cmd: |
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=argocd-server -n argocd --timeout=300s
      args:
        executable: /bin/bash
      register: wait_result
      until: wait_result.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Restart ArgoCD server to load account config
      ansible.builtin.shell:
        cmd: |
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n argocd rollout restart deploy/argocd-server
      args:
        executable: /bin/bash
      changed_when: true

    - name: Wait for ArgoCD server rollout
      ansible.builtin.shell:
        cmd: |
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n argocd rollout status deploy/argocd-server --timeout=300s
      args:
        executable: /bin/bash
      register: argocd_rollout
      until: argocd_rollout.rc == 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Get ArgoCD admin password
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
      args:
        executable: /bin/bash
      register: argocd_password
      changed_when: false

    - name: Generate Homepage ArgoCD API token
      ansible.builtin.shell:
        cmd: |
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n argocd exec deploy/argocd-server -- \
            env ARGOCD_ADMIN_PASSWORD='{{ argocd_password.stdout }}' \
                ARGOCD_HOMEPAGE_ACCOUNT='{{ argocd_homepage_account }}' \
            sh -c '
              set -eu
              argocd login localhost:8080 \
                --username admin \
                --password "$ARGOCD_ADMIN_PASSWORD" \
                --plaintext \
                --config /tmp/argocd-homepage-cli
              argocd account generate-token \
                --account "$ARGOCD_HOMEPAGE_ACCOUNT" \
                --config /tmp/argocd-homepage-cli
            '
      args:
        executable: /bin/bash
      register: argocd_homepage_token
      until: argocd_homepage_token.rc == 0
      retries: 12
      delay: 10
      changed_when: false

    - name: Display ArgoCD access information
      ansible.builtin.debug:
        msg: |
          ArgoCD has been installed successfully!

          Access ArgoCD UI:
          - URL: http://{{ ansible_host }}:{{ argocd_node_port }}
          - Username: admin
          - Password: {{ argocd_password.stdout }}

          Homepage monitoring account:
          - Account: {{ argocd_homepage_account }}
          - Token: {{ argocd_homepage_token.stdout }}

          To access via port-forward:
          KUBECONFIG=./kubeconfig kubectl port-forward svc/argocd-server -n argocd 8080:80

          Reverse proxy backend:
          http://{{ ansible_host }}:{{ argocd_node_port }}
